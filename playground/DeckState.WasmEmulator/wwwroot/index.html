<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>DeckState Emulator</title>
  <base href="./" />
  <style>
    :root {
      --bg:#0b0f17; --fg:#eef4ff; --muted:#8b97ab; --line:#1e2836;
      --panel:#131a26; --bezel:#04060a; --key-empty:#0c131e; --accent:#5a49a0;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--bg); color:var(--fg);
      font-family:-apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif; }
    .app { max-width:900px; margin:0 auto; padding:20px 16px 40px; }

    /* Toolbar */
    .bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:18px; }
    .bar .group { display:flex; align-items:center; gap:6px; }
    .bar label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    .bar select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
      border-radius:8px; padding:8px 10px; font-size:14px; cursor:pointer; }
    .bar .spacer { flex:1; }
    .btn { background:var(--panel); color:var(--fg); border:1px solid var(--line);
      border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; }
    .btn:hover { border-color:#2c3a4f; }
    .btn.on { background:var(--accent); border-color:var(--accent); color:#fff; }

    /* Deck */
    .deck { background:var(--bezel); border:1px solid #10151f; border-radius:18px;
      padding:18px; box-shadow:inset 0 2px 8px rgba(0,0,0,.6); width:fit-content;
      max-width:100%; margin:0 auto; }
    .deck-grid { display:grid; gap:10px; }
    .k { position:relative; aspect-ratio:1/1; border-radius:10px; border:0; padding:0;
      background:var(--key-empty); overflow:hidden; cursor:default;
      -webkit-tap-highlight-color:transparent; box-shadow:0 1px 0 rgba(255,255,255,.03); }
    .k svg { width:100%; height:100%; display:block; }
    .k.pressable { cursor:pointer; }
    .k.pressable:active { transform:scale(.96); }

    /* Configure mode */
    .cfg .k { cursor:pointer; outline:1px dashed #33415a; outline-offset:-3px; }
    .cfg .k:hover { outline-color:var(--accent); }
    .badge { position:absolute; top:4px; left:4px; right:4px; font-size:10px; line-height:1.2;
      text-align:center; color:#dfe6f2; background:rgba(6,10,18,.72); border-radius:5px;
      padding:2px 3px; pointer-events:none; }
    .k.empty .plus { position:absolute; inset:0; display:flex; align-items:center;
      justify-content:center; color:#3a4a63; font-size:22px; }

    .hint { color:var(--muted); font-size:13px; text-align:center; margin:16px auto 0;
      max-width:560px; line-height:1.6; }
    .hint code { color:#cdd7ea; }
    #boot { color:var(--muted); font-size:14px; padding:60px 20px; text-align:center; }
  </style>
</head>
<body>
  <div id="app"><div id="boot">Loading the real DeckState runtime (WebAssembly)…</div></div>
  <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#b4232a;color:#fff;padding:8px 12px;font-size:13px;">
    An error occurred. <a href="" style="color:#fff;text-decoration:underline;">Reload</a>
  </div>
  <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
